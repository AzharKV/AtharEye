<!-- @dsCard group="OptiSync App" viewport="390x760" subtitle="Interactive iPhone app — Projects, detail scrubber, report" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OptiSync — App UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html,body{height:100%;margin:0;background:#0c1119;}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 0%, #182334 0%, #0c1119 60%, #07090e 100%);overflow:hidden;}
  .phone{position:relative;width:390px;height:760px;flex:none;background:var(--canvas);border-radius:46px;
    box-shadow:0 0 0 11px #0a0d13,0 0 0 13px #1c2330,0 40px 90px rgba(0,0,0,.6);overflow:hidden;}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#0a0d13;border-radius:18px;z-index:61;}
  #app{position:absolute;inset:0;border-radius:46px;overflow:hidden;}
  .scr-anim{animation:si .26s cubic-bezier(.2,.8,.2,1);}
  @keyframes si{from{transform:translateY(7px)}}
</style>
</head>
<body>
<div id="stage">
  <div class="phone">
    <div class="notch"></div>
    <div id="app"></div>
  </div>
</div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="ProjectsScreen.jsx"></script>
<script type="text/babel" src="DetailScreen.jsx"></script>
<script type="text/babel" src="ReportScreen.jsx"></script>
<script type="text/babel">
  // DS namespace (bundle exposes all components under one global)
  window.DS = Object.values(window).find(v => v && v.Donut && v.StageChip && v.Card) || window;

  function App() {
    const [view, setView] = React.useState({ screen: 'projects' });
    const [tab, setTab] = React.useState('projects');
    const proj = id => window.KIT.projects.find(p => p.id === id);
    const go = (screen, params) => setView(Object.assign({ screen }, params));

    let body, showTab = false;
    if (view.screen === 'projects') { body = <ProjectsScreen onOpen={id => go('detail', { id })} />; showTab = true; }
    else if (view.screen === 'detail') body = <DetailScreen project={proj(view.id)} onBack={() => { setTab('projects'); go('projects'); }} onReport={(p, c) => go('report', { id: p.id, coverage: c })} />;
    else if (view.screen === 'report') body = <ReportScreen project={proj(view.id)} coverage={view.coverage} onBack={() => go('detail', { id: view.id })} />;
    else { body = <ProjectsScreen onOpen={id => go('detail', { id })} />; showTab = true; }

    return (
      <React.Fragment>
        <StatusBar />
        <div className="scr-anim" key={view.screen + (view.id || '')} style={{ position: 'absolute', inset: 0 }}>{body}</div>
        {showTab && <TabBar active={tab} onTab={t => { setTab(t); go(t === 'account' || t === 'scan' ? 'projects' : t); }} />}
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
