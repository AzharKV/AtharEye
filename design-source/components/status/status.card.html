<!-- @dsCard group="Components" viewport="700x150" subtitle="StageChip · StatusPill · SeverityDot" name="Status indicators" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface);padding:20px;font-family:var(--font-sans)}
.grp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.lab{font-size:11px;color:var(--muted);width:70px}</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find(v => v && v.StageChip && v.StatusPill) || window;
const { StageChip, StatusPill, SeverityDot } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div>
    <div className="grp"><span className="lab">Stage</span><StageChip stage="Early"/><StageChip stage="Mid"/><StageChip stage="Complete"/></div>
    <div className="grp"><span className="lab">Health</span><StatusPill status="On track"/><StatusPill status="Needs review"/><StatusPill status="Behind"/></div>
    <div className="grp"><span className="lab">Severity</span><SeverityDot severity="Critical" label="Critical"/><SeverityDot severity="Major" label="Major"/><SeverityDot severity="Minor" label="Minor"/></div>
  </div>
);
</script>
</body></html>
