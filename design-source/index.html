<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  html, body { margin: 0; height: 100%; background: #0A0E12; overflow: hidden; }
  #root { height: 100vh; height: 100dvh; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* nav stack transitions (iOS push/pop) */
  @keyframes navEnter     { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes navExit      { from { transform: translateX(0); }   to { transform: translateX(100%); } }
  @keyframes navToUnder   { from { transform: translateX(0); }   to { transform: translateX(-24%); } }
  @keyframes navFromUnder { from { transform: translateX(-24%); } to { transform: translateX(0); } }

  /* sheets / scrim / toast / modal */
  @keyframes sheetUp   { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes sheetDown { from { transform: translateY(0); }   to { transform: translateY(100%); } }
  @keyframes scrimIn   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scrimOut  { from { opacity: 1; } to { opacity: 0; } }
  @keyframes toastUp   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes modalUp   { from { transform: translateY(100%); } to { transform: translateY(0); } }

  /* misc */
  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes splashRise { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes splashOut  { to { opacity: 0; visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; } }
</style>
</head>
