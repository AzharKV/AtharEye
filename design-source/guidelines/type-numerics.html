<!-- @dsCard group="Type" viewport="700x150" subtitle="Tabular lining figures — every % and date" name="Numerics (.mono)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);padding:20px;font-family:var(--font-sans)}
.row{display:flex;gap:28px;align-items:baseline}
.big{font-size:38px;font-weight:700;color:var(--ink)}.lab{font-size:11px;color:var(--muted);margin-top:6px}</style>
</head><body>
<div class="row">
  <div><div class="big mono">62<span style="font-size:18px">%</span></div><div class="lab">Coverage</div></div>
  <div><div class="big mono">220<span style="font-size:18px">mm</span></div><div class="lab">Deviation</div></div>
  <div><div class="big mono">9&nbsp;Jun&nbsp;2026</div><div class="lab">Scan date</div></div>
  <div><div class="big mono">£49</div><div class="lab">Plan / mo</div></div>
</div>
<div class="lab" style="margin-top:16px">All numerics use <b>tabular-nums lining-nums</b> so figures align in columns and stay legible at small sizes.</div>
</body></html>
