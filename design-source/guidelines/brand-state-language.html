<!-- @dsCard group="Brand" viewport="700x150" subtitle="State language: Early / Mid / Complete + health" name="Stage & status language" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);padding:20px;font-family:var(--font-sans)}
.grp{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.lab{font-size:11px;color:var(--muted);width:78px}</style>
</head><body>
<div class="grp"><span class="lab">Stage</span>
  <span class="chip early"><span class="dot"></span>Early stage</span>
  <span class="chip mid"><span class="dot"></span>Mid-build</span>
  <span class="chip complete"><span class="dot"></span>Complete</span>
</div>
<div class="grp"><span class="lab">Health</span>
  <span class="status ontrack"><span class="dot"></span>On track</span>
  <span class="status review"><span class="dot"></span>Needs review</span>
  <span class="status behind"><span class="dot"></span>Behind</span>
  <span class="status done"><span class="dot"></span>Complete</span>
</div>
</body></html>
