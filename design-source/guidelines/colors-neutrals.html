<!-- @dsCard group="Colors" viewport="700x150" subtitle="Canvas · surface · hairline · ink · muted" name="Neutrals" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--canvas);padding:18px;font-family:var(--font-sans)}
.row{display:flex;gap:12px}.sw{flex:1}.chip{height:64px;border-radius:12px;border:1px solid var(--hairline)}
.nm{font-size:12px;font-weight:700;color:var(--ink);margin-top:8px}.hx{font-size:11px;color:var(--muted)}</style>
</head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--canvas)"></div><div class="nm">Canvas</div><div class="hx mono">#EDF1F6</div></div>
  <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="nm">Surface</div><div class="hx mono">#FFFFFF</div></div>
  <div class="sw"><div class="chip" style="background:var(--hairline)"></div><div class="nm">Hairline</div><div class="hx mono">#D8E1EC</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="nm" style="color:var(--ink)">Ink</div><div class="hx mono">#1B2A3D</div></div>
  <div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="nm">Muted</div><div class="hx mono">#64748B</div></div>
</div>
</body></html>
