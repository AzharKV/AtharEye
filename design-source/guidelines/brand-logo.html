<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--canvas);padding:24px;font-family:var(--font-sans);display:flex;align-items:center;gap:24px}
.logo{width:96px;height:96px;border-radius:22px;box-shadow:var(--sh-pop);object-fit:cover}
.word{font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}

</head><body>
<img class="logo" src="../assets/optisync-logo.jpeg" alt="OptiSync">
<div>
  <div class="word">Opti<b>Sync</b></div>
  <div class="tag"><span style="color:var(--navy)">Scan.</span><span style="color:var(--navy)">Compare.</span><span style="color:var(--teal)">Prove.</span></div>
</div>
</body></html>
