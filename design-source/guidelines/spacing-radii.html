<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Corner radii: 10 / 14 / 20 / pill" name="Radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--canvas);padding:18px;font-family:var(--font-sans)}
.row{display:flex;gap:16px;align-items:flex-end}.b{background:var(--surface);border:1px solid var(--hairline);width:88px;height:64px}
.nm{font-size:12px;font-weight:700;color:var(--ink);margin-top:8px}.hx{font-size:11px;color:var(--muted)}</style>
</head><body>
<div class="row">
  <div><div class="b" style="border-radius:var(--r-sm)"></div><div class="nm">--r-sm</div><div class="hx mono">10px · inputs</div></div>
  <div><div class="b" style="border-radius:var(--r)"></div><div class="nm">--r</div><div class="hx mono">14px · cards/btns</div></div>
  <div><div class="b" style="border-radius:var(--r-lg)"></div><div class="nm">--r-lg</div><div class="hx mono">20px · sheets</div></div>
  <div><div class="b" style="border-radius:var(--r-pill);width:120px"></div><div class="nm">--r-pill</div><div class="hx mono">999px · chips</div></div>
</div>
</body></html>
