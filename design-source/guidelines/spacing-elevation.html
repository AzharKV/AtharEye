<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Two-step elevation: card rest + popover" name="Elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--canvas);padding:24px;font-family:var(--font-sans)}
.row{display:flex;gap:32px}.b{background:var(--surface);width:160px;height:84px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.nm{font-size:12px;font-weight:700;color:var(--ink);margin-top:12px}.hx{font-size:11px;color:var(--muted)}</style>
</head><body>
<div class="row">
  <div><div class="b" style="box-shadow:var(--sh-card)">Card</div><div class="nm">--sh-card</div><div class="hx">Resting surfaces</div></div>
  <div><div class="b" style="box-shadow:var(--sh-pop)">Popover</div><div class="nm">--sh-pop</div><div class="hx">Sheets, scan result</div></div>
</div>
</body></html>
