<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface);padding:20px;font-family:var(--font-sans)}
.row{display:flex;gap:14px;align-items:flex-end}.col{text-align:center}
.bar{background:var(--navy);border-radius:3px;width:26px}.nm{font-size:10.5px;color:var(--muted);margin-top:6px}</style>
</head><body>
<div class="row">
  <div class="col"><div class="bar" style="height:4px"></div><div class="nm mono">4</div></div>
  <div class="col"><div class="bar" style="height:8px"></div><div class="nm mono">8</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="nm mono">12</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="nm mono">16</div></div>
  <div class="col"><div class="bar" style="height:20px"></div><div class="nm mono">20</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="nm mono">24</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="nm mono">32</div></div>
</div>
</body></html>
