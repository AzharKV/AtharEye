<!-- @dsCard group="Colors" viewport="700x150" subtitle="Navy structure · blue in-progress · teal verified" name="Primary & structure" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--canvas);padding:18px;font-family:var(--font-sans)}
.row{display:flex;gap:12px}.sw{flex:1}.chip{height:64px;border-radius:12px;box-shadow:var(--sh-card)}
.nm{font-size:12px;font-weight:700;color:var(--ink);margin-top:8px}.hx{font-size:11px;color:var(--muted)}.hx,.nm{letter-spacing:0}</style>
</head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--navy)"></div><div class="nm">Navy</div><div class="hx mono">#1E3A66</div><div class="hx">Primary · nav · buttons</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue)"></div><div class="nm">Blue</div><div class="hx mono">#2D6FB0</div><div class="hx">In-progress</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal)"></div><div class="nm">Teal</div><div class="hx mono">#18837E</div><div class="hx">Verified · complete</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-bright)"></div><div class="nm">Teal bright</div><div class="hx mono">#2FB6AD</div><div class="hx">Live scan accent</div></div>
</div>
</body></html>
