<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OptiSync — Progress & Coverage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<template id="__bundler_thumbnail">

    <circle cx="50" cy="50" r="33" fill="none" stroke="#18837E" stroke-width="7" stroke-linecap="round" stroke-dasharray="207" stroke-dashoffset="58" transform="rotate(-90 50 50)"/>

<style>
  html,body{height:100%;}
  #app{position:absolute;inset:0;border-radius:46px;overflow:hidden;}
  #app-fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#64748B;font-family:-apple-system,sans-serif;font-size:14px;}
</style>
</head>
<body>
<div id="stage">
  <div class="phone">

</style>

</html>
