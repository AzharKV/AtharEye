<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 + user-scalable=no kills the 300ms tap delay & pinch-zoom; viewport-fit=cover enables safe-area insets -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>OptiSync</title>
    <meta
      name="description"
      content="Scan a site with iPhone LiDAR, align to BIM, and prove progress &amp; coverage. Scan. Compare. Prove."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- iOS standalone PWA: fullscreen, no Safari chrome. Light app → default (dark) status-bar text. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OptiSync" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      /* Inter — self-hosted variable font (offline-safe, precached by the SW). */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #edf1f6;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        height: 100vh;
        height: 100dvh;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Inter', -apple-system, system-ui, 'SF Pro', sans-serif;
        /* no 300ms tap delay, no double-tap zoom (§4.4) */
        touch-action: manipulation;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        /* app-like: no accidental text selection / iOS long-press callout on UI chrome */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* …but keep real form fields selectable/editable */
      input,
      textarea,
      [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }
      /* hidden scrollbars + momentum scrolling (§4.5) */
      .no-scrollbar::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      /* nav stack transitions (iOS push/pop) — transform-only, GPU-composited */
      @keyframes navEnter {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }
      @keyframes navExit {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(100%);
        }
      }
      @keyframes navToUnder {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-24%);
        }
      }
      @keyframes navFromUnder {
        from {
          transform: translateX(-24%);
        }
        to {
          transform: translateX(0);
        }
      }

      /* sheets / scrim / toast / modal */
      @keyframes sheetUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes sheetDown {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(100%);
        }
      }
      @keyframes scrimIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scrimOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes toastUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes modalUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      /* misc */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes splashRise {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes splashOut {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      /* skeleton sheen — transform-only so it stays GPU-composited (§4.2) */
      @keyframes shimmerX {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      /* Static first-paint splash — visible before React hydrates so there is
         never a blank flash (§4.3). Removed by main.tsx once React mounts. */
      /* Match the OS (Android/iOS) native launch splash: same solid background
         color as the manifest, and the icon centered at the same spot — so when
         the OS splash hands off to the web app the icon doesn't jump/shrink. The
         wordmark fades in below the icon (absolute, so the icon never moves). */
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #edf1f6;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
      }
      #initial-splash .brand {
        position: relative;
      }
      #initial-splash .mark {
        display: block;
        width: 112px;
        height: 112px;
      }
      #initial-splash .meta {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 20px;
        text-align: center;
        white-space: nowrap;
        animation: fadeIn 0.5s ease 0.35s both;
      }
      #initial-splash .word {
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.8px;
        color: #1b2a3d;
      }
      #initial-splash .word span {
        color: #18837e;
      }
      #initial-splash .tag {
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: #64748b;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- instant brand splash; matches the OS splash + the React <Splash>, handed off seamlessly -->
    <div id="initial-splash">
      <div class="brand">
        <!-- Placeholder OptiSync mark (scan reticle on navy). Swapped for the real logo at the brand phase. -->
        <svg class="mark" viewBox="0 0 112 112" xmlns="http://www.w3.org/2000/svg" aria-label="OptiSync">
          <rect width="112" height="112" rx="25" fill="#1E3A66" />
          <circle cx="56" cy="56" r="30" fill="none" stroke="#18837E" stroke-width="4.5" />
          <circle cx="56" cy="56" r="9" fill="#18837E" />
          <g stroke="#18837E" stroke-width="4" stroke-linecap="round" opacity="0.65">
            <path d="M56 14 V24" />
            <path d="M56 88 V98" />
            <path d="M14 56 H24" />
            <path d="M88 56 H98" />
          </g>
        </svg>
        <div class="meta">
          <div class="word">Opti<span>Sync</span></div>
          <div class="tag">Scan. Compare. Prove.</div>
        </div>
      </div>
    </div>
    <noscript
      ><div style="color: #1b2a3d; font-family: 'Inter', -apple-system, system-ui; padding: 24px">
        OptiSync needs JavaScript enabled to run.
      </div></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
